<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <title>SAP Stammtisch | Global Community</title>    <script src="https://d3js.org/d3.v7.min.js"></script>    <script src="https://unpkg.com/topojson@3"></script>    <style>        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;500;700&display=swap');        :root {            --sap-yellow: #FFD700;            --sap-black: #000000;            --off-white: #FBFBFB;            --map-gray: #EAEAEA;        }        body {             font-family: 'Inter', sans-serif;             background-color: var(--off-white);             color: var(--sap-black);            margin: 0; padding-bottom: 100px;            scroll-behavior: smooth;        }        header { padding: 60px 20px 20px; text-align: center; }        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 3.5rem; text-transform: uppercase; letter-spacing: -2px; margin: 0; }        .highlight-yellow { background: var(--sap-yellow); padding: 0 15px; }        .intro-container {            max-width: 800px; margin: 30px auto; text-align: left;            border-left: 5px solid var(--sap-black); padding: 15px 40px;            background: white; box-shadow: 10px 10px 0px var(--sap-yellow);        }        /* --- Navigation Lane --- */        .nav-lane {            position: sticky; top: 0; z-index: 1000;            background: white; border-bottom: 2px solid var(--sap-black);            padding: 15px 20px; display: flex; justify-content: center; gap: 15px;            box-shadow: 0 4px 10px rgba(0,0,0,0.05);        }        .country-btn {            background: var(--sap-black); color: white; border: none;            padding: 10px 20px; cursor: pointer; border-radius: 4px;            font-family: 'Space Grotesk', sans-serif; font-weight: 700;            transition: 0.2s; text-align: center; min-width: 120px;        }        .country-btn:hover { background: var(--sap-yellow); color: var(--sap-black); transform: translateY(-3px); }        .btn-dots { display: block; font-size: 14px; color: var(--sap-yellow); margin-top: 4px; letter-spacing: 2px; }        .country-btn:hover .btn-dots { color: var(--sap-black); }        /* --- Tiles --- */        .dashboard { display: flex; flex-direction: column; gap: 80px; padding: 40px; max-width: 1200px; margin: auto; }        .country-tile {             display: flex; background: white; border: 2px solid var(--sap-black);            box-shadow: 15px 15px 0px rgba(0,0,0,0.05); border-radius: 4px; overflow: hidden;        }        .map-area { flex: 1.4; position: relative; background-image: radial-gradient(var(--map-gray) 1px, transparent 0); background-size: 24px 24px; }        .side-panel { flex: 1; background: var(--sap-black); color: white; display: flex; flex-direction: column; }        .panel-header { padding: 25px 30px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.4rem; background: var(--sap-yellow); color: var(--sap-black); text-transform: uppercase; }        .city-list { padding: 15px; }        .city-item { padding: 20px 25px; margin-bottom: 10px; cursor: pointer; border: 1px solid #222; transition: 0.3s cubic-bezier(0.165, 0.84, 0.44, 1); display: flex; flex-direction: column; gap: 4px; }        .city-name { font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }        .city-details { font-size: 0.8rem; font-weight: 400; color: #888; }        .city-item:hover { background: var(--sap-yellow); transform: translateX(8px); border-color: var(--sap-yellow); }        .city-item:hover .city-name, .city-item:hover .city-details { color: var(--sap-black); }        .land { fill: #f9f9f9; stroke: var(--sap-black); stroke-width: 1.2px; }        .dot { fill: var(--sap-yellow); stroke: var(--sap-black); stroke-width: 2px; }        .dot.highlight { r: 14; fill: #fff; stroke-width: 3px; }        .tooltip { position: absolute; padding: 12px 18px; background: var(--sap-black); color: white; font-size: 13px; z-index: 1001; border-bottom: 4px solid var(--sap-yellow); }        .svg-shadow { filter: drop-shadow(20px 20px 0px rgba(0,0,0,0.06)); }        /* Flag Helper */        .flag { margin-right: 8px; font-style: normal; }    </style></head><body><header>    <h1>SAP <span class="highlight-yellow">Stammtisch</span></h1>    <div class="intro-container">        <p>An <strong>SAP Stammtisch</strong> is a community-led meetup where professionals trade formal halls for local tables. No sales pitches—just pure knowledge sharing and networking over a drink.</p>    </div></header><div class="nav-lane" id="navLane"></div><div id="container" class="dashboard"></div><script>const tooltip = d3.select("body").append("div").attr("class", "tooltip").style("opacity", 0);const flagMap = {    "Germany": "🇩🇪",    "Austria": "🇦🇹",    "Switzerland": "🇨🇭"};d3.json("location.json").then(data => {    // 1. Group and Sort Countries by Location Count (Highest First)    const countryGroups = Array.from(d3.group(data, d => d.country))        .sort((a, b) => b[1].length - a[1].length);    // 2. Build Navigation Lane    const navLane = d3.select("#navLane");    countryGroups.forEach(([country, cities]) => {        const btn = navLane.append("button")            .attr("class", "country-btn")            .on("click", () => {                document.getElementById(`tile-${country}`).scrollIntoView({ behavior: 'smooth' });            });                btn.append("div").html(`<i class="flag">${flagMap[country] || '🌐'}</i> ${country} (${cities.length})`);                // Add a visual dot for every event under the name        const dotsContainer = btn.append("div").attr("class", "btn-dots");        cities.forEach(() => dotsContainer.append("span").text("●"));    });    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {                countryGroups.forEach(([countryName, cities]) => {            const sorted = [...cities].sort((a,b) => b.lat - a.lat);            const dynamicHeight = Math.max(600, (sorted.length * 92) + 80);            const tile = d3.select("#container").append("div")                .attr("class", "country-tile")                .attr("id", `tile-${countryName}`)                .style("height", dynamicHeight + "px");            const mapArea = tile.append("div").attr("class", "map-area");            const sidePanel = tile.append("div").attr("class", "side-panel");            sidePanel.append("div").attr("class", "panel-header").text(countryName);            const listContainer = sidePanel.append("div").attr("class", "city-list");            const width = 600, height = dynamicHeight;            const svg = mapArea.append("svg").attr("viewBox", `0 0 ${width} ${height}`).style("width", "100%").style("height", "100%");            const geo = topojson.feature(world, world.objects.countries).features.find(d => d.properties.name === countryName);            const projection = d3.geoMercator().fitSize([width - 100, height - 100], geo);            const path = d3.geoPath().projection(projection);            svg.append("path").datum(geo).attr("class", "land svg-shadow").attr("d", path);            // Dots on Map            svg.selectAll(".dot").data(cities).enter().append("circle")                .attr("class", d => `dot dot-${d.id}`)                .attr("cx", d => projection([d.lon, d.lat])[0])                .attr("cy", d => projection([d.lon, d.lat])[1])                .attr("r", 10)                .on("mouseover", (event, d) => showDetail(event, d))                .on("mouseout", hideDetail);            // Side Panel Items            sorted.forEach(c => {                const item = listContainer.append("div")                    .attr("class", `city-item item-${c.id}`)                    .on("mouseover", (event) => {                        const [x, y] = projection([c.lon, c.lat]);                        svg.select(`.dot-${c.id}`).classed("highlight", true);                        const mapRect = mapArea.node().getBoundingClientRect();                        showDetail({pageX: mapRect.left + x, pageY: mapRect.top + y}, c);                    })                    .on("mouseout", () => {                        svg.selectAll(".dot").classed("highlight", false);                        hideDetail();                    })                    .on("click", () => window.open(c.group, '_blank'));                item.append("div").attr("class", "city-name").html(`${c.city} <span>↗</span>`);                item.append("div").attr("class", "city-details").text(`Organized by: ${c.organizers}`);            });            function showDetail(event, d) {                tooltip.transition().duration(100).style("opacity", 1);                tooltip.html(`<strong>${d.city.toUpperCase()}</strong><br/>${d.organizers}`)                    .style("left", (event.pageX + 25) + "px")                    .style("top", (event.pageY - 25) + "px");            }            function hideDetail() {                tooltip.transition().duration(300).style("opacity", 0);            }        });    });});</script></body></html>
