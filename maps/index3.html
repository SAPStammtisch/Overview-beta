<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <title>SAP Stammtisch | Community Map</title>    <script src="https://d3js.org/d3.v7.min.js"></script>    <script src="https://unpkg.com/topojson@3"></script>    <style>        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;500;700&display=swap');        :root {            --sap-yellow: #FFD700;            --sap-black: #000000;            --off-white: #FBFBFB;            --map-gray: #EAEAEA;            --text-gray: #666;        }        body {             font-family: 'Inter', sans-serif;             background-color: var(--off-white);             color: var(--sap-black);            margin: 0; padding-bottom: 100px;        }        header {             padding: 80px 20px 40px;             text-align: center;         }        h1 {             font-family: 'Space Grotesk', sans-serif;            font-size: 4rem;             font-weight: 700;            margin: 0;             text-transform: uppercase;            letter-spacing: -2px;        }        .highlight-yellow {            background: var(--sap-yellow);            padding: 0 15px;            display: inline-block;        }        .intro-container {            max-width: 800px;            margin: 40px auto;            text-align: left;            border-left: 5px solid var(--sap-black);            padding: 10px 40px;            background: white;            box-shadow: 15px 15px 0px var(--sap-yellow);        }        .dashboard {             display: flex; flex-direction: column; gap: 60px;             padding: 20px; max-width: 1200px; margin: auto;         }        .country-tile {             display: flex;             background: white;            border: 2px solid var(--sap-black);            box-shadow: 15px 15px 0px rgba(0,0,0,0.05);            border-radius: 4px;            overflow: hidden;        }        .map-area {             flex: 1.4;             position: relative;             background-image: radial-gradient(var(--map-gray) 1px, transparent 0);            background-size: 24px 24px;        }                .side-panel {             flex: 1;             background: var(--sap-black);             color: white;            display: flex; flex-direction: column;        }        .panel-header {            padding: 25px 30px;            font-family: 'Space Grotesk', sans-serif;            font-weight: 700;            font-size: 1.4rem;            background: var(--sap-yellow);            color: var(--sap-black);            text-transform: uppercase;        }        .city-list { padding: 15px; }        .city-item {             padding: 20px 25px;             margin-bottom: 10px;            cursor: pointer;             border: 1px solid #222;            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);            display: flex;            flex-direction: column;            gap: 4px;        }        .city-name {            font-size: 1.2rem;            font-weight: 700;            display: flex;            justify-content: space-between;            align-items: center;        }        .city-details {            font-size: 0.85rem;            font-weight: 400;            color: #999;            transition: color 0.3s;        }        .city-item:hover {             background: var(--sap-yellow);             transform: translateX(8px);            border-color: var(--sap-yellow);        }        .city-item:hover .city-name,         .city-item:hover .city-details {             color: var(--sap-black);         }        /* Map SVG Styles */        .land { fill: #f9f9f9; stroke: var(--sap-black); stroke-width: 1.2px; }        .dot {             fill: var(--sap-yellow); stroke: var(--sap-black); stroke-width: 2px;             filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.2));        }        .dot.highlight { r: 14; fill: #fff; stroke-width: 3px; }        .tooltip {             position: absolute; padding: 12px 18px; background: var(--sap-black);             color: white; font-size: 13px; z-index: 1000;            border-bottom: 4px solid var(--sap-yellow);        }        .svg-shadow { filter: drop-shadow(20px 20px 0px rgba(0,0,0,0.06)); }    </style></head><body><header>    <h1>SAP <span class="highlight-yellow">Stammtisch</span></h1>    <div class="intro-container">        <p>            An <strong>SAP Stammtisch</strong> is a community-led meetup where professionals trade formal halls for local tables. No sales pitches—just pure knowledge sharing and networking.        </p>    </div></header><div id="container" class="dashboard"></div><script>const tooltip = d3.select("body").append("div").attr("class", "tooltip").style("opacity", 0);d3.json("location.json").then(data => {    const countryGroups = d3.group(data, d => d.country);    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {                countryGroups.forEach((cities, countryName) => {            const sorted = [...cities].sort((a,b) => b.lat - a.lat);            // Dynamic height adjustment to prevent scrolling            const dynamicHeight = Math.max(600, (sorted.length * 95) + 80);            const tile = d3.select("#container").append("div")                .attr("class", "country-tile")                .style("height", dynamicHeight + "px");            const mapArea = tile.append("div").attr("class", "map-area");            const sidePanel = tile.append("div").attr("class", "side-panel");            sidePanel.append("div").attr("class", "panel-header").text(countryName);            const listContainer = sidePanel.append("div").attr("class", "city-list");            // SVG Logic            const width = 600, height = dynamicHeight;            const svg = mapArea.append("svg").attr("viewBox", `0 0 ${width} ${height}`).style("width", "100%").style("height", "100%");            const geo = topojson.feature(world, world.objects.countries).features.find(d => d.properties.name === countryName);            const projection = d3.geoMercator().fitSize([width - 100, height - 100], geo);            const path = d3.geoPath().projection(projection);            svg.append("path").datum(geo).attr("class", "land svg-shadow").attr("d", path);            // Dots            svg.selectAll(".dot").data(cities).enter().append("circle")                .attr("class", d => `dot dot-${d.id}`)                .attr("cx", d => projection([d.lon, d.lat])[0])                .attr("cy", d => projection([d.lon, d.lat])[1])                .attr("r", 10)                .on("mouseover", (event, d) => showDetail(event, d))                .on("mouseout", hideDetail);            // Detailed Side Panel Items            sorted.forEach(c => {                const item = listContainer.append("div")                    .attr("class", `city-item item-${c.id}`)                    .on("mouseover", (event) => {                        const [x, y] = projection([c.lon, c.lat]);                        svg.select(`.dot-${c.id}`).classed("highlight", true);                        const mapRect = mapArea.node().getBoundingClientRect();                        showDetail({pageX: mapRect.left + x, pageY: mapRect.top + y}, c);                    })                    .on("mouseout", () => {                        svg.selectAll(".dot").classed("highlight", false);                        hideDetail();                    })                    .on("click", () => window.open(c.group, '_blank'));                item.append("div").attr("class", "city-name")                    .html(`${c.city} <span style="font-size: 0.7rem; opacity: 0.5;">LINK ↗</span>`);                                item.append("div").attr("class", "city-details")                    .text(`Organized by: ${c.organizers}`);            });            function showDetail(event, d) {                tooltip.transition().duration(100).style("opacity", 1);                tooltip.html(`<strong>${d.city.toUpperCase()}</strong><br/>${d.organizers}`)                    .style("left", (event.pageX + 25) + "px")                    .style("top", (event.pageY - 25) + "px");            }            function hideDetail() {                tooltip.transition().duration(300).style("opacity", 0);            }        });    });});</script></body></html>
